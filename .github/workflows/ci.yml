name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-ci:
    name: Server CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_mpg
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_long_value
      GUEST_JWT_EXPIRES_IN: 2h
      CLIENT_ORIGIN: http://localhost:5173
      BCRYPT_SALT_ROUNDS: 10
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: server

      - name: Typecheck
        run: npm run typecheck
        working-directory: server

      - name: Lint
        run: npm run --if-present lint
        working-directory: server

      - name: Unit tests
        run: npm run test:run
        working-directory: server

      - name: Run migrations
        run: npm run db:migrate
        working-directory: server

      - name: Integration tests
        run: npm run test:integration
        working-directory: server

  client-ci:
    name: Client CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: client

      - name: Typecheck
        run: npm run typecheck
        working-directory: client

      - name: Lint
        run: npm run --if-present lint
        working-directory: client

      - name: Unit tests
        run: npm run test:run
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

  shared-ci:
    name: Shared CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: shared

      - name: Typecheck
        run: npm run typecheck
        working-directory: shared

  publish-and-deploy:
    name: Publish images and update deployment
    needs: [server-ci, client-ci, shared-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: arifbdjh/tictactoe-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: arifbdjh/tictactoe-frontend:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=https://tictactoe.tech-bangla.com/api
            VITE_SOCKET_URL=https://tictactoe.tech-bangla.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Update deployment manifests
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["IMAGE_TAG"]
          updates = [
              ("backend.yaml", "tictactoe-backend"),
              ("migration.yaml", "tictactoe-backend"),
              ("frontend.yaml", "tictactoe-frontend"),
          ]

          for filename, image in updates:
              path = Path("k8s/tictactoe") / filename
              pattern = rf"(image:\s*arifbdjh/{re.escape(image)}:)[^\s]+"
              updated, count = re.subn(
                  pattern, lambda match: match.group(1) + tag, path.read_text()
              )
              if count != 1:
                  raise SystemExit(f"Expected exactly one image reference in {path}")
              path.write_text(updated)
          PY

      - name: Commit and push deployment update
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists. Leaving deployment to its workflow."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/tictactoe/backend.yaml \
                  k8s/tictactoe/migration.yaml \
                  k8s/tictactoe/frontend.yaml

          git diff --cached --quiet && exit 0
          git commit -m "Deploy images built from ${GITHUB_SHA}"
          git push origin HEAD:main
