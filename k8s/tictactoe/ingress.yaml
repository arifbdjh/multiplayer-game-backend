apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tictactoe
  namespace: tictactoe
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.org/websocket-services: backend
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
    nginx.org/client-max-body-size: "6m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tictactoe.tech-bangla.com
      secretName: tictactoe-tls
  rules:
    - host: tictactoe.tech-bangla.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
