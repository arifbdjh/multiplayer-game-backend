apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tictactoe
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tictactoe-backend
  template:
    metadata:
      labels:
        app: tictactoe-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: backend
          image: arifbdjh/tictactoe-backend:v1
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: tictactoe-config
            - secretRef:
                name: tictactoe-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:5000/api/health',{signal:AbortSignal.timeout(3000)}).then(async r=>{const h=await r.json();process.exit(r.ok&&h.db===true&&h.redis===true?0:1)}).catch(()=>process.exit(1))"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /app/server/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: tictactoe-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tictactoe
spec:
  type: ClusterIP
  selector:
    app: tictactoe-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
