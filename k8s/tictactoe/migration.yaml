apiVersion: batch/v1
kind: Job
metadata:
  name: tictactoe-db-migrate
  namespace: tictactoe
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: arifbdjh/tictactoe-backend:v1
          workingDir: /app/server
          command:
            - node
            - dist/server/src/db/migrate.js
          envFrom:
            - configMapRef:
                name: tictactoe-config
            - secretRef:
                name: tictactoe-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
