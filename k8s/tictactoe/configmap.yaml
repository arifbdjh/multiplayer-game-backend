apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: tictactoe-config
  namespace: tictactoe
data:
  NODE_ENV: "production"
  PORT: "5000"
  CLIENT_ORIGIN: "https://tictactoe.tech-bangla.com"
  JWT_EXPIRES_IN: "7d"
  GUEST_JWT_EXPIRES_IN: "2h"
  ROOM_TTL_SECONDS: "7200"
  MATCHMAKING_TTL_SECONDS: "300"
  BCRYPT_SALT_ROUNDS: "12"
  UPLOAD_MAX_BYTES: "5242880"
  LOG_LEVEL: "info"
