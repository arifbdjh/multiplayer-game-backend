apiVersion: v1
kind: PersistentVolume
metadata:
  name: tictactoe-redis-pv
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: tictactoe
    name: redis-data
  iscsi:
    targetPortal: 192.168.0.134:3260
    iqn: iqn.2005-10.org.freenas.ctl:tictactoe-redis
    lun: 0
    fsType: ext4
    readOnly: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: tictactoe
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: tictactoe-redis-pv
  resources:
    requests:
      storage: 1Gi
